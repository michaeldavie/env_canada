name: Python Lint and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # Runs every hook in .pre-commit-config.yaml, including ruff and mypy
      # from the uv-locked environment.
      - name: Pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor through the version Home Assistant runs.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Test
        run: uv run --frozen pytest --cov --cov-report=term-missing

  test-minimum:
    # The lockfile pins recent versions, so the matrix above never sees the
    # minimums pyproject.toml declares. This resolves every direct
    # dependency to its minimum instead: code that starts relying on
    # something newer fails here, rather than for a user who has the older
    # version installed. 3.11 is the only version all the minimums support.
    name: Test (minimum dependencies)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Test
        run: uv run --resolution lowest-direct pytest

  # Branch protection on main requires a status check named "build", the
  # name of the single job this workflow used to have. This job carries that
  # name and succeeds only when every job above did, so the matrix can change
  # without touching the protection rule.
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint, test, test-minimum]
    if: always()
    steps:
      - name: Check that every job succeeded
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "test-minimum: ${{ needs.test-minimum.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.test-minimum.result }}" != "success" ]; then
            exit 1
          fi
