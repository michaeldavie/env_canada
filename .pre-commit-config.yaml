repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: mixed-line-ending
      - id: name-tests-test
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-ast # checks if files parse as valid python
      - id: check-case-conflict # files that would conflict in case-insensitive filesystems
      - id: check-docstring-first # docstring before code
      - id: check-toml
      - id: check-json
      - id: pretty-format-json
        args: [--autofix]
      - id: check-yaml
        args: [--allow-multiple-documents] # required for multi-document .yml files
      - id: detect-private-key
      - id: end-of-file-fixer # ensure that file is either empty, or ends with one newline
      - id: trailing-whitespace
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          - mdformat-ruff
  - repo: local
    hooks:
      # ruff and mypy run from the project's locked environment, so that
      # pre-commit, CI and a plain `uv run ruff`/`uv run mypy` all use the
      # same version and the same configuration from pyproject.toml.
      # Dependabot keeps uv.lock current.
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-use-type-annotations
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      - id: python-check-mock-methods
      - id: python-no-eval
      - id: python-no-log-warn
